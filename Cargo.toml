[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danfirsten/scion"
rust-version = "1.85"

[workspace.dependencies]
# Parsing. The grammar crates version independently of the core crate: each
# depends only on `tree-sitter-language ^0.1` and exports a `LanguageFn`, so the
# numbers are not meant to line up (docs/prior-art.md §6.2). What has to hold is
# the *parser ABI*, and that is verified empirically — `tests/language_config.rs`
# loads every grammar and `tests/*` parse every fixture with it.
# tree-sitter-java 0.23.5 and tree-sitter-typescript 0.23.2 both ship ABI 14
# grammars, which the 0.26.x runtime still loads.
tree-sitter = "0.26.11"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"

# CLI / errors.
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
thiserror = "2.0.19"

# Serialization.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Testing.
insta = "1.48.0"
# `proptest`'s default feature set pulls in `rusty-fork`/`tempfile` to run each
# case in a forked child. We do not want that: our properties are pure, forking
# would multiply the cost of a few thousand merges by a process spawn each, and
# the panic-safety story the driver needs is tested against the real binary
# instead (crates/sm-cli/tests/cli_merge.rs).
proptest = { version = "1.9.0", default-features = false, features = ["std", "bit-set"] }
tempfile = "3.27.0"

# Internal crates.
sm-bind = { path = "crates/sm-bind", version = "0.0.0" }
sm-cst = { path = "crates/sm-cst", version = "0.0.0" }
sm-diff = { path = "crates/sm-diff", version = "0.0.0" }
sm-emit = { path = "crates/sm-emit", version = "0.0.0" }
sm-eval = { path = "crates/sm-eval", version = "0.0.0" }
sm-match = { path = "crates/sm-match", version = "0.0.0" }
sm-merge = { path = "crates/sm-merge", version = "0.0.0" }
